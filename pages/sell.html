<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell Property</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .image-preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }
        .image-preview {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="header-placeholder"></div>
    <section class="min-h-screen flex flex-col md:flex-row">
        <div class="md:w-1/2 bg-cover bg-center" style="background-image: url('/assets/images/house15.jpg.jpg')">
            <div class="h-full w-full bg-black/50 flex items-center justify-center p-8">
                <h2 class="text-white text-3xl md:text-4xl font-bold text-center">Sell Your Property with Us</h2>
            </div>
        </div>

        <div class="md:w-1/2 p-8 lg:p-16 flex items-center justify-center">
            <div class="w-full max-w-xl">
                <h3 class="text-2xl font-semibold mb-6 text-gray-700">Property Details</h3>
                <form class="space-y-6" id="sell-property-form">

                    <!-- Personal Info -->
                    <div>
                        <label for="fullName" class="block mb-1 font-semibold text-gray-700">Full Name</label>
                        <input type="text" id="fullName" placeholder="John Doe" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <div>
                        <label for="email" class="block mb-1 font-semibold text-gray-700">Email Address</label>
                        <input type="email" id="email" placeholder="john.doe@example.com" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <div>
                        <label for="phone" class="block mb-1 font-semibold text-gray-700">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+233 24 123 4567" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                    </div>

                    <!-- Property Details -->
                    <div>
                        <label for="propertyType" class="block mb-1 font-semibold text-gray-700">Property Type</label>
                        <select id="propertyType" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                            <option value="" disabled selected>Select a property type</option>
                            <option>House</option>
                            <option>Apartment</option>
                            <option>Land</option>
                            <option>Commercial</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="location" class="block mb-1 font-semibold text-gray-700">Location</label>
                        <input type="text" id="location" placeholder="e.g. Lome, Togo" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500" required>
                    </div>
                    <div>
                        <label for="price" class="block mb-1 font-semibold text-gray-700">
                            Price
                        </label>
                        <div class="flex">
                            <!-- Price input -->
                            <input type="number" id="price" placeholder="e.g. 350000"
                                class="w-2/3 p-3 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
                                required>
                            <!-- Currency selector -->
                            <select id="currency"
                                class="w-1/3 p-3 border border-gray-300 rounded-r-lg bg-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                                <option value="CFA" selected>CFA</option>
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="GHS">GHS</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="description" class="block mb-1 font-semibold text-gray-700">Property Description</label>
                        <textarea id="description" placeholder="e.g. 3-bedroom house with a large backyard and a pool..." rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                    </div>

                    <!-- Image Upload (Works for both Desktop & Mobile) -->
                    <div>
                        <label for="images" class="block mb-1 font-semibold text-gray-700">Upload Property Images</label>
                        <input 
                            type="file" 
                            id="images" 
                            accept="image/*" 
                            multiple 
                            class="w-full p-3 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100"
                        >
                        <div id="image-previews" class="image-preview-container mt-4"></div>
                        <p class="text-sm text-gray-500 mt-2">
                            <span id="image-count" class="font-semibold text-red-500">0/4 images selected.</span>
                            <span id="image-message">Please add exactly 4 images.</span>
                        </p>
                    </div>

                    <div>
                        <button type="submit" class="w-full bg-amber-500 text-white font-bold py-3 rounded-lg hover:bg-amber-600 transition-colors duration-300">
                            Submit Property
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <div id="footer-placeholder"></div>
    <script src="/assets/js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const imagesInput = document.getElementById('images');
            const imagePreviews = document.getElementById('image-previews');
            const imageCount = document.getElementById('image-count');
            const imageMessage = document.getElementById('image-message');
            const form = document.getElementById('sell-property-form');

            const MAX_IMAGES = 4;
            let selectedFiles = [];

            const updatePreview = () => {
                imagePreviews.innerHTML = '';
                selectedFiles.forEach(file => {
                    const img = document.createElement('img');
                    img.classList.add('image-preview');
                    img.src = URL.createObjectURL(file);
                    img.onload = () => URL.revokeObjectURL(img.src);
                    imagePreviews.appendChild(img);
                });

                imageCount.textContent = `${selectedFiles.length}/${MAX_IMAGES} images selected.`;
                if (selectedFiles.length === MAX_IMAGES) {
                    imageCount.classList.replace('text-red-500', 'text-green-500');
                    imageMessage.textContent = 'All 4 images have been selected!';
                } else {
                    imageCount.classList.replace('text-green-500', 'text-red-500');
                    imageMessage.textContent = `Please add exactly ${MAX_IMAGES - selectedFiles.length} more images.`;
                }
            };

            const handleFiles = (files) => {
                const newFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
                selectedFiles = [...selectedFiles, ...newFiles].slice(0, MAX_IMAGES);
                if (newFiles.length > 0) updatePreview();
            };

            imagesInput.addEventListener('change', (event) => handleFiles(event.target.files));

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (selectedFiles.length !== MAX_IMAGES) {
                    alert(`Please upload exactly ${MAX_IMAGES} images.`);
                    return;
                }
                alert('Your property has been submitted successfully!');
                window.history.back(); // Go to the previous page
            });
        });
    </script>
</body>
</html>
