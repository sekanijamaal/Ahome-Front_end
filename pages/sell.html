<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sell Property</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .image-preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
        }
        .image-preview-wrapper {
            position: relative;
            width: 100%;
        }
        .image-preview {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            display: block;
        }
        .remove-image-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(255, 0, 0, 0.8);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: background 0.2s;
        }
        .remove-image-btn:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="header-placeholder"></div>
    <div class="pt-16"></div>

    <section class="min-h-screen flex flex-col md:flex-row">
        
        <div class="md:w-1/2 bg-cover bg-center" style="background-image: url('/assets/images/house15.jpg.jpg')">
            <div class="h-full w-full bg-black/50 flex items-center justify-center p-8">
                <h2 class="text-white text-3xl md:text-4xl font-bold text-center">Sell Your Property with Us</h2>
            </div>
        </div>

        <div class="md:w-1/2 p-8 lg:p-16 flex items-center justify-center">
            <div class="w-full max-w-xl">
                <h3 class="text-2xl font-semibold mb-6 text-gray-700">Property Details</h3>
                <form class="space-y-6" id="sell-property-form">

                    <div>
                        <label for="fullName" class="block mb-1 font-semibold text-gray-700">Full Name</label>
                        <input type="text" id="fullName" placeholder="John Doe" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors" required>
                    </div>
                    <div>
                        <label for="email" class="block mb-1 font-semibold text-gray-700">Email Address</label>
                        <input type="email" id="email" placeholder="john.doe@example.com" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors" required>
                    </div>
                    <div>
                        <label for="phone" class="block mb-1 font-semibold text-gray-700">Phone Number</label>
                        <input type="tel" id="phone" placeholder="+233 24 123 4567" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors" required>
                    </div>

                    <div>
                        <label for="propertyType" class="block mb-1 font-semibold text-gray-700">Property Type</label>
                        <select id="propertyType" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors" required>
                            <option value="" disabled selected>Select a property type</option>
                            <option>House</option>
                            <option>Apartment</option>
                            <option>Land</option>
                            <option>Commercial</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="location" class="block mb-1 font-semibold text-gray-700">Location</label>
                        <input type="text" id="location" placeholder="e.g. Accra, Ghana" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors" required>
                    </div>
                    <div>
                        <label for="price" class="block mb-1 font-semibold text-gray-700">Price (GHS/USD)</label>
                        <input type="number" id="price" placeholder="e.g. 350000" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors" required>
                    </div>
                    <div>
                        <label for="description" class="block mb-1 font-semibold text-gray-700">Property Description</label>
                        <textarea id="description" placeholder="e.g. 3-bedroom house with a large backyard and a pool..." rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors"></textarea>
                    </div>

                    <div class="hidden md:block">
                        <label for="desktopImages" class="block mb-1 font-semibold text-gray-700">Upload Property Images</label>
                        <input 
                            type="file" 
                            id="desktopImages" 
                            accept="image/*" 
                            multiple 
                            class="w-full p-3 border border-gray-300 rounded-lg file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 transition-colors"
                        >
                        <div id="desktop-image-previews" class="image-preview-container mt-4"></div>
                        <p class="text-sm text-gray-500 mt-2">
                          <span id="desktop-image-count" class="font-semibold text-red-500">0/4 images selected.</span>
                          <span id="desktop-image-message">Please add exactly 4 images.</span>
                        </p>
                    </div>

                    <div class="block md:hidden">
                        <p class="block mb-1 font-semibold text-gray-700">Add Property Images</p>
                        <div class="flex space-x-4">
                            <button type="button" id="upload-button" class="flex-1 flex items-center justify-center space-x-2 py-3 px-4 border border-gray-300 rounded-lg text-sm bg-white hover:bg-gray-100 transition-colors">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span>Upload Photos</span>
                            </button>
                            <button type="button" id="camera-button" class="flex-1 flex items-center justify-center space-x-2 py-3 px-4 border border-gray-300 rounded-lg text-sm bg-white hover:bg-gray-100 transition-colors">
                                <i class="fa-solid fa-camera"></i>
                                <span>Take Photo</span>
                            </button>
                        </div>
                        <input type="file" id="upload-input" accept="image/*" multiple class="hidden">
                        <input type="file" id="camera-input" accept="image/*" multiple capture="environment" class="hidden">

                        <div id="image-previews" class="image-preview-container mt-4"></div>

                        <p class="text-sm text-gray-500 mt-2">
                          <span id="image-count" class="font-semibold text-red-500">0/4 images selected.</span>
                          <span id="image-message">Please add exactly 4 images.</span>
                        </p>
                    </div>

                    <div>
                        <button type="submit" class="w-full bg-amber-500 text-white font-bold py-3 rounded-lg hover:bg-amber-600 transition-colors duration-300">
                            Submit Property
                        </button>
                    </div>
                    
                </form>
            </div>
        </div>
    </section>
    <div id="footer-placeholder"></div>
    <!-- Confirmation Modal -->
    <div id="confirmation-modal" style="display:none;position:fixed;z-index:1000;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.3);">
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:2rem 2.5rem;border-radius:1rem;box-shadow:0 4px 32px rgba(0,0,0,0.15);text-align:center;min-width:250px;">
        <h4 style="font-size:1.3rem;font-weight:700;color:#16a34a;margin-bottom:1rem;">Property submitted</h4>
        <p style="color:#444;font-size:1rem;">Thank you! Redirecting...</p>
      </div>
    </div>
    <script src="/assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Mobile
            const uploadButton = document.getElementById('upload-button');
            const cameraButton = document.getElementById('camera-button');
            const uploadInput = document.getElementById('upload-input');
            const cameraInput = document.getElementById('camera-input');
            const imagePreviews = document.getElementById('image-previews');
            const imageCount = document.getElementById('image-count');
            const imageMessage = document.getElementById('image-message');
            // Desktop
            const desktopImagesInput = document.getElementById('desktopImages');
            const desktopImagePreviews = document.getElementById('desktop-image-previews');
            const desktopImageCount = document.getElementById('desktop-image-count');
            const desktopImageMessage = document.getElementById('desktop-image-message');

            const MAX_IMAGES = 4;
            let selectedFiles = [];
            let desktopSelectedFiles = [];

            // Mobile: update preview and count
            const updatePreview = () => {
                imagePreviews.innerHTML = '';
                selectedFiles.forEach((file, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.classList.add('image-preview-wrapper');

                    const img = document.createElement('img');
                    img.classList.add('image-preview');
                    img.src = URL.createObjectURL(file);
                    img.onload = () => URL.revokeObjectURL(img.src);

                    // Remove button
                    const removeBtn = document.createElement('button');
                    removeBtn.type = 'button';
                    removeBtn.className = 'remove-image-btn';
                    removeBtn.title = 'Remove image';
                    removeBtn.innerHTML = '&times;';
                    removeBtn.addEventListener('click', () => {
                        selectedFiles.splice(idx, 1);
                        updatePreview();
                    });

                    wrapper.appendChild(img);
                    wrapper.appendChild(removeBtn);
                    imagePreviews.appendChild(wrapper);
                });

                imageCount.textContent = `${selectedFiles.length}/${MAX_IMAGES} images selected.`;
                if (selectedFiles.length === MAX_IMAGES) {
                    imageCount.classList.remove('text-red-500');
                    imageCount.classList.add('text-green-500');
                    imageMessage.textContent = 'All 4 images have been selected!';
                } else {
                    imageCount.classList.remove('text-green-500');
                    imageCount.classList.add('text-red-500');
                    imageMessage.textContent = `Please add exactly ${MAX_IMAGES - selectedFiles.length} more images.`;
                }
            };

            // Desktop: update preview and count
            const updateDesktopPreview = () => {
                desktopImagePreviews.innerHTML = '';
                desktopSelectedFiles.forEach((file, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.classList.add('image-preview-wrapper');

                    const img = document.createElement('img');
                    img.classList.add('image-preview');
                    img.src = URL.createObjectURL(file);
                    img.onload = () => URL.revokeObjectURL(img.src);

                    // Remove button
                    const removeBtn = document.createElement('button');
                    removeBtn.type = 'button';
                    removeBtn.className = 'remove-image-btn';
                    removeBtn.title = 'Remove image';
                    removeBtn.innerHTML = '&times;';
                    removeBtn.addEventListener('click', () => {
                        desktopSelectedFiles.splice(idx, 1);
                        updateDesktopPreview();
                    });

                    wrapper.appendChild(img);
                    wrapper.appendChild(removeBtn);
                    desktopImagePreviews.appendChild(wrapper);
                });

                desktopImageCount.textContent = `${desktopSelectedFiles.length}/${MAX_IMAGES} images selected.`;
                if (desktopSelectedFiles.length === MAX_IMAGES) {
                    desktopImageCount.classList.remove('text-red-500');
                    desktopImageCount.classList.add('text-green-500');
                    desktopImageMessage.textContent = 'All 4 images have been selected!';
                } else {
                    desktopImageCount.classList.remove('text-green-500');
                    desktopImageCount.classList.add('text-red-500');
                    desktopImageMessage.textContent = `Please add exactly ${MAX_IMAGES - desktopSelectedFiles.length} more images.`;
                }
            };

            // Mobile: handle files
            const handleFiles = (files) => {
                const newFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
                selectedFiles = [...selectedFiles, ...newFiles].slice(0, MAX_IMAGES);
                if (newFiles.length > 0) {
                  updatePreview();
                }
            };

            // Desktop: handle files
            const handleDesktopFiles = (files) => {
                const newFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
                desktopSelectedFiles = [...desktopSelectedFiles, ...newFiles].slice(0, MAX_IMAGES);
                if (newFiles.length > 0) {
                  updateDesktopPreview();
                }
            };

            // Mobile triggers
            if (uploadButton) {
                uploadButton.addEventListener('click', () => uploadInput.click());
            }
            if (cameraButton) {
                cameraButton.addEventListener('click', () => cameraInput.click());
            }
            if (uploadInput) {
                uploadInput.addEventListener('change', (event) => handleFiles(event.target.files));
            }
            if (cameraInput) {
                cameraInput.addEventListener('change', (event) => handleFiles(event.target.files));
            }

            // Desktop triggers
            if (desktopImagesInput) {
                desktopImagesInput.addEventListener('change', (event) => handleDesktopFiles(event.target.files));
            }
            // Confirmation and redirect on submit
            const form = document.getElementById('sell-property-form');
            const confirmationModal = document.getElementById('confirmation-modal');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    let valid = true;
                    // Always check both arrays in case of resizing or switching views
                    const mobileCount = selectedFiles.length;
                    const desktopCount = desktopSelectedFiles.length;
                    if (window.innerWidth < 768) {
                        if (mobileCount !== MAX_IMAGES) {
                            imageMessage.textContent = `Please add exactly 4 images.`;
                            imageCount.classList.remove('text-green-500');
                            imageCount.classList.add('text-red-500');
                            valid = false;
                        }
                    } else {
                        if (desktopCount !== MAX_IMAGES) {
                            desktopImageMessage.textContent = `Please add exactly 4 images.`;
                            desktopImageCount.classList.remove('text-green-500');
                            desktopImageCount.classList.add('text-red-500');
                            valid = false;
                        }
                    }
                    // Fallback: if both are empty, block submit
                    if (mobileCount === 0 && desktopCount === 0) {
                        if (window.innerWidth < 768) {
                            imageMessage.textContent = `Please add exactly 4 images.`;
                            imageCount.classList.remove('text-green-500');
                            imageCount.classList.add('text-red-500');
                        } else {
                            desktopImageMessage.textContent = `Please add exactly 4 images.`;
                            desktopImageCount.classList.remove('text-green-500');
                            desktopImageCount.classList.add('text-red-500');
                        }
                        valid = false;
                    }
                    if (!valid) return;
                    confirmationModal.style.display = 'block';
                    setTimeout(() => {
                        if (window.history.length > 1) {
                            window.history.back();
                        } else {
                            window.location.href = '/pages/purchase.html';
                        }
                    }, 1800);
                });
            }
        });
    </script>
</body>
</html>
