<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volunteer at Ahome</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
<div id="header-placeholder"></div>

  <section class="min-h-screen flex flex-col md:flex-row items-stretch">
    
    <!-- Left Image -->
    <div class="w-full md:w-1/2 h-64 md:h-auto">
      <img src="/assets/images/Picture6.jpg" 
           alt="Volunteer at Ahome" 
           class="w-full h-full object-cover">
    </div>

    <!-- Right Form -->
    <div class="w-full md:w-1/2 bg-white p-8 md:p-16 flex flex-col justify-center">
      <h2 class="text-3xl font-bold text-gray-900 mb-6">Volunteer with Ahome</h2>
      <p class="text-gray-600 mb-6">Help us bring hope, support, and change. Sign up to make a real impact as a volunteer.</p>
      
      <form action="#" method="POST" class="space-y-4">
        <div>
          <label for="name" class="block font-semibold text-sm text-gray-700">Full Name</label>
          <input type="text" id="name" name="name" required class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="email" class="block font-semibold text-sm text-gray-700">Email Address</label>
          <input type="email" id="email" name="email" required class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="interest" class="block font-semibold text-sm text-gray-700">Area of Interest</label>
          <input type="text" id="interest" name="interest" placeholder="e.g. Teaching, Counseling, Medical Aid" class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="message" class="block font-semibold text-sm text-gray-700">Why Do You Want to Volunteer?</label>
          <textarea id="message" name="message" rows="4" required class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition">Join as Volunteer</button>
      </form>
    </div>

  </section>
    <div id="footer-placeholder"></div>

    <script src="/assets/js/main.js"></script>

</body>
</html>
