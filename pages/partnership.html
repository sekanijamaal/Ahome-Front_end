<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
<div id="header-placeholder"></div>

  <section class="min-h-screen flex flex-col md:flex-row items-stretch">
    
    <!-- Left Image - full cover -->
    <div class="w-full md:w-1/2 h-64 md:h-auto">
      <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70" 
           alt="Partner with Us" 
           class="w-full h-full object-cover">
    </div>

    <!-- Right Form -->
    <div class="w-full md:w-1/2 bg-white p-8 md:p-16 flex flex-col justify-center">
      <h2 class="text-3xl font-bold text-gray-900 mb-6">Become a Partner</h2>
      <p class="text-gray-600 mb-6">Join us in building a better future. Let’s collaborate to make a lasting impact in our communities.</p>
      
      <form action="#" method="POST" class="space-y-4">
        <div>
          <label for="name" class="block font-semibold text-sm text-gray-700">Full Name</label>
          <input type="text" id="name" name="name" required class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="company" class="block font-semibold text-sm text-gray-700">Company/Organization</label>
          <input type="text" id="company" name="company" required class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="email" class="block font-semibold text-sm text-gray-700">Email Address</label>
          <input type="email" id="email" name="email" required class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="message" class="block font-semibold text-sm text-gray-700">Your Proposal</label>
          <textarea id="message" name="message" rows="4" required class="w-full mt-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">Submit Partnership</button>
      </form>
    </div>

  </section>
    <div id="footer-placeholder"></div>

    <script src="/assets/js/main.js"></script>

</body>
</html>
