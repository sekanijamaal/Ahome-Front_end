<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hire Us Today</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
<div id="header-placeholder"></div>
    <section class="min-h-screen flex flex-col md:flex-row">
        <div class="md:w-1/2 h-64 md:h-auto overflow-hidden">
            <img src="/assets/images/men working on builing.jpg" alt="Hire Us" class="w-full h-full object-cover transition-transform duration-500 hover:scale-105" />
        </div>

        <div class="md:w-1/2 p-6 md:p-16 flex items-center justify-center">
            <div class="w-full max-w-lg">
                <h2 class="text-3xl font-extrabold mb-6 text-gray-800">Hire Us Today</h2>
                <p class="text-gray-600 mb-8">Tell us about your project and we'll get back to you with a tailored solution.</p>
                <form class="space-y-6">
                    <div>
                        <label for="fullName" class="block mb-1 font-semibold text-gray-700">Full Name</label>
                        <input type="text" id="fullName" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
                    </div>
                    <div>
                        <label for="email" class="block mb-1 font-semibold text-gray-700">Email</label>
                        <input type="email" id="email" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" required>
                    </div>
                    <div>
                        <label for="organization" class="block mb-1 font-semibold text-gray-700">Organization <span class="font-normal text-gray-500">(Optional)</span></label>
                        <input type="text" id="organization" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                    <div>
                        <label class="block mb-2 font-semibold text-gray-700">Services Needed</label>
                        <div class="space-y-2">
                            <label class="flex items-center space-x-2 text-gray-700">
                                <input type="checkbox" name="services" value="Consulting" class="form-checkbox text-blue-600 rounded-sm focus:ring-blue-500">
                                <span>Consulting</span>
                            </label>
                            <label class="flex items-center space-x-2 text-gray-700">
                                <input type="checkbox" name="services" value="Tech Solutions" class="form-checkbox text-blue-600 rounded-sm focus:ring-blue-500">
                                <span>Architecture Solutions</span>
                            </label>
                            <label class="flex items-center space-x-2 text-gray-700">
                                <input type="checkbox" name="services" value="Community Engagement" class="form-checkbox text-blue-600 rounded-sm focus:ring-blue-500">
                                <span>Community Projects</span>
                            </label>
                            <label class="flex items-center space-x-2 text-gray-700">
                                <input type="checkbox" name="services" value="Event Organization" class="form-checkbox text-blue-600 rounded-sm focus:ring-blue-500">
                                <span>Event Organization</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label for="description" class="block mb-1 font-semibold text-gray-700">Project Description</label>
                        <textarea id="description" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" rows="4" placeholder="Describe your project, goals, and any specific requirements."></textarea>
                    </div>
                    <div>
                        <label for="budget" class="block mb-1 font-semibold text-gray-700">Budget Range</label>
                        <select id="budget" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                            <option value="" disabled selected>Select a budget range</option>
                            <option value="below-1k">Below $1,000</option>
                            <option value="1k-5k">$1,000 - $5,000</option>
                            <option value="5k-10k">$5,000 - $10,000</option>
                            <option value="10k+">$10,000+</option>
                        </select>
                    </div>
                    <div>
                        <label for="timeline" class="block mb-1 font-semibold text-gray-700">Timeline</label>
                        <input type="text" id="timeline" placeholder="e.g. 2 weeks, 1 month, Q4 2025" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                    <div>
                        <label for="source" class="block mb-1 font-semibold text-gray-700">How did you hear about us?</label>
                        <input type="text" id="source" class="w-full border border-gray-300 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition-colors duration-300">Submit Request</button>
                </form>
            </div>
        </div>
    </section>
    <div id="footer-placeholder"></div>

    <script src="/assets/js/main.js"></script>

</body>
</html>
