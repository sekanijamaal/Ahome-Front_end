    body {
      font-family: 'Inter', sans-serif;
    }
    .property-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(122, 62, 62, 0.1);
    }
    .property-image {
      height: 200px;
      object-fit: cover;
    }
    .details-image {
      height: 300px;
      object-fit: cover;
    }
    #detailMap {
      height: 250px;
    }
    .transition-all {
      transition: all 0.3s ease;
    }
    .similar-property:hover {
      transform: scale(1.02);
    }
    
    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px 0;
    }
    .modal.active {
      display: block;
    }
    .modal-content {
      background-color: white;
      margin: 0 auto;
      width: 95%;
      max-width: 1200px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 5px 30px rgba(0,0,0,0.3);
      transform: translateY(-20px);
      opacity: 0;
      transition: all 0.3s ease;
    }
    .modal.active .modal-content {
      transform: translateY(0);
      opacity: 1;
    }
    .modal-close {
      position: fixed;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 1001;
    }
    .active-property {
      border: 3px solid #86a5d8;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
    }
    
    /* New styles for scrollable right content */
    .modal-right-content {
      max-height: calc(100vh - 150px);
      overflow-y: auto;
      padding-right: 8px;
    }
    
    /* Scrollbar styling */
    .modal-right-content::-webkit-scrollbar {
      width: 4px;
    }
    .modal-right-content::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    .modal-right-content::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 10px;
    }
    .modal-right-content::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    /* Mobile specific styles */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 2rem;
      }
      .hero-subtitle {
        font-size: 1rem;
      }
      .filter-container {
        flex-direction: column;
        gap: 0.5rem;
      }
      .filter-container select {
        width: 100%;
      }
      .details-image {
        height: 200px;
      }
      #detailMap {
        height: 200px;
      }
      .modal-content {
        width: 100%;
        margin: 0;
        border-radius: 0;
      }
      .modal-right-content {
        max-height: none;
        overflow-y: visible;
      }
      .feature-grid {
        grid-template-columns: 1fr !important;
      }
    }

    @media (max-width: 640px) {
      .property-grid {
        grid-template-columns: 1fr;
      }
      .similar-properties-grid {
        grid-template-columns: 1fr;
      }
      .modal-content .grid {
        grid-template-columns: 1fr !important;
        gap: 1rem;
      }
      .modal-right-content {
        padding-right: 0;
      }
    }

      description: "Stunning beachfront Airbnb with direct access to the sand. Perfect for vacation rentals with high-end amenities, smart home features, and breathtaking ocean views from the private balcony.",
      features: ["Beachfront", "Smart Home", "Fully Equipped Kitchen", "Balcony", "Air Conditioning", "Washer/Dryer", "Parking", "WiFi"],
      images: [
        "/assets/images/properties/VM029/WhatsApp Image 2025-04-16 at 11.26.58.jpeg",
        "/assets/images/properties/VM029/WhatsApp Image 2025-04-16 at 11.27.11.jpeg",
        "/assets/images/properties/VM029/WhatsApp Image 2025-04-16 at 11.27.48.jpeg"
      ],
      location: [25.7823, -80.1865],
      agent: {
        name: "Vacation Rentals Inc",
        phone: "(555) 555-1234",
        email: "rentals@luxuryestates.com",
        image: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?ixlib=rb-1.2.1&auto=format&fit=crop&w=634&q=80"
      }
    },
    {
      id: 12,
      title: "LL031",
      address: "909 Urban Way, New York, NY",
      price: "$275/night",
      type: "airbnb",
      bedrooms: 1,
      bathrooms: 1,
      area: "800 sq ft",
      description: "Trendy downtown loft perfect for short-term rentals. Features exposed brick, modern furnishings, and all the amenities needed for a comfortable stay in the heart of the city.",
      features: ["Downtown", "Exposed Brick", "Smart TV", "Coffee Maker", "Air Conditioning", "Washer/Dryer", "Elevator", "WiFi"],
      images: [
        "/assets/images/properties/LL031/WhatsApp Image 2025-05-21 at 23.45.01.jpeg",
        "/assets/images/properties/LL031/WhatsApp Image 2025-05-21 at 23.45.00.jpeg",
        "/assets/images/properties/LL031/WhatsApp Image 2025-05-21 at 23.44.54.jpeg",
        "/assets/images/properties/LL031/WhatsApp Image 2025-05-21 at 23.44.58.jpeg"
      ],
      location: [40.7196, -74.0018],
      agent: {
        name: "City Stay Rentals",
        phone: "(555) 555-5678",
        email: "citystay@luxuryestates.com",
        image: "https://images.unsplash.com/photo-1562788869-4ed32648eb72?ixlib=rb-1.2.1&auto=format&fit=crop&w=634&q=80"
      }
    }
  ];

  // DOM Elements
  const propertyGrid = document.getElementById('propertyGrid');
  const propertyModal = document.getElementById('propertyModal');
  const modalClose = document.getElementById('modalClose');
  const searchInput = document.getElementById('mainSearch');
  const filterType = document.getElementById('filterType');
  const filterBedrooms = document.getElementById('filterBedrooms');
  let detailMap;

  // Initialize the application
  function init() {
    renderPropertyGrid(properties);
    setupEventListeners();
  }

  // Render property grid
  function renderPropertyGrid(propertiesToRender) {
    propertyGrid.innerHTML = '';
    
    propertiesToRender.forEach(property => {
      let typeClass, typeText;
      switch(property.type) {
        case 'sale':
          typeClass = 'bg-green-100 text-green-800';
          typeText = 'For Sale';
          break;
        case 'rent':
          typeClass = 'bg-blue-100 text-blue-800';
          typeText = 'For Rent';
          break;
        case 'airbnb':
          typeClass = 'bg-purple-100 text-purple-800';
          typeText = 'Airbnb';
          break;
        case 'land':
          typeClass = 'bg-yellow-100 text-yellow-800';
          typeText = 'Land';
          break;
        default:
          typeClass = 'bg-gray-100 text-gray-800';
          typeText = property.type;
      }

      const propertyCard = document.createElement('div');
      propertyCard.className = 'property-card bg-white rounded-lg shadow-md overflow-hidden transition-all hover:shadow-xl';
      propertyCard.innerHTML = `
        <img src="${property.images[0]}" alt="${property.title}" class="property-image w-full">
        <div class="p-4">
          <h3 class="text-lg font-semibold mb-1">${property.title}</h3>
          <p class="text-gray-600 text-sm mb-2">${property.address}</p>
          <div class="flex justify-between items-center mb-3">
            <span class="text-blue-600 font-bold">${property.price}</span>
            <span class="text-xs ${typeClass} px-2 py-1 rounded-full">
              ${typeText}
            </span>
          </div>
          <div class="flex justify-between text-xs sm:text-sm text-gray-500 mb-4">
            ${property.type === 'land' ? 
              `<span>${property.area}</span>
               <span>Land</span>
               <span>Development</span>` : 
              `<span>${property.bedrooms} Beds</span>
               <span>${property.bathrooms} Baths</span>
               <span>${property.area}</span>`}
          </div>
          <button class="view-details w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition-all text-sm sm:text-base" data-id="${property.id}">
            View Details
          </button>
        </div>
      `;
      propertyGrid.appendChild(propertyCard);
    });
  }

  // Show property details in modal
  function showPropertyDetails(propertyId) {
    const property = properties.find(p => p.id === propertyId);
    if (!property) return;
    
    // Remove active class from all similar properties
    document.querySelectorAll('.similar-property').forEach(el => {
      el.classList.remove('active-property');
    });
    
    // Set basic property info
    document.getElementById('detailTitle').textContent = property.title;
    document.getElementById('detailAddress').textContent = property.address;
    document.getElementById('detailPrice').textContent = property.price;
    
    // Set property type badge
    const typeBadge = document.getElementById('detailType');
    typeBadge.textContent = property.type === 'sale' ? 'For Sale' : 
                           property.type === 'rent' ? 'For Rent' : 
                           property.type === 'airbnb' ? 'Airbnb' : 'Land';
    
    typeBadge.className = `text-sm font-semibold px-3 py-1 rounded-full ${
      property.type === 'sale' ? 'bg-green-100 text-green-800' : 
      property.type === 'rent' ? 'bg-blue-100 text-blue-800' : 
      property.type === 'airbnb' ? 'bg-purple-100 text-purple-800' : 
      'bg-yellow-100 text-yellow-800'}`;
    
    // Update detail labels based on property type
    if (property.type === 'land') {
      document.getElementById('detailLabel1').textContent = 'Acreage';
      document.getElementById('detailLabel2').textContent = 'Zoning';
      document.getElementById('detailLabel3').textContent = 'Terrain';
      
      document.getElementById('detailBedrooms').textContent = property.area;
      document.getElementById('detailBathrooms').textContent = property.features.find(f => f.includes('Zoning')) || 'Various';
      document.getElementById('detailArea').textContent = property.features.find(f => f.includes('Terrain') || f.includes('View')) || 'Various';
    } else {
      document.getElementById('detailLabel1').textContent = 'Bedrooms';
      document.getElementById('detailLabel2').textContent = 'Bathrooms';
      document.getElementById('detailLabel3').textContent = 'Area';
      
      document.getElementById('detailBedrooms').textContent = property.bedrooms;
      document.getElementById('detailBathrooms').textContent = property.bathrooms;
      document.getElementById('detailArea').textContent = property.area;
    }
    
    document.getElementById('detailDescription').textContent = property.description;
    
    // Set agent info
    document.getElementById('agentName').textContent = property.agent.name;
    document.getElementById('agentPhone').textContent = property.agent.phone;
    document.getElementById('agentEmail').textContent = property.agent.email;
    document.getElementById('agentImage').src = property.agent.image;
    document.getElementById('agentImage').alt = property.agent.name;
    
    // Render features
    const featuresContainer = document.getElementById('detailFeatures');
    featuresContainer.innerHTML = '';
    property.features.forEach(feature => {
      const featureElement = document.createElement('div');
      featureElement.className = 'flex items-center';
      featureElement.innerHTML = `
        <svg class="h-4 w-4 md:h-5 md:w-5 text-green-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span class="text-sm md:text-base">${feature}</span>
      `;
      featuresContainer.appendChild(featureElement);
    });
    
    // Render image gallery
    const galleryContainer = document.getElementById('propertyImageGallery');
    galleryContainer.innerHTML = `
      <img src="${property.images[0]}" alt="${property.title}" class="details-image w-full rounded-lg cursor-pointer">
    `;
    
    const thumbnailsContainer = galleryContainer.nextElementSibling;
    thumbnailsContainer.innerHTML = '';
    property.images.forEach((image, index) => {
      const thumbnail = document.createElement('img');
      thumbnail.src = image;
      thumbnail.alt = `${property.title} - Image ${index + 1}`;
      thumbnail.className = 'h-16 md:h-20 object-cover rounded cursor-pointer hover:opacity-80 transition-all';
      thumbnail.addEventListener('click', () => {
        galleryContainer.innerHTML = `<img src="${image}" alt="${property.title}" class="details-image w-full rounded-lg cursor-pointer">`;
      });
      thumbnailsContainer.appendChild(thumbnail);
    });
    
    // Initialize detail map
    initDetailMap(property.location);
    
    // Show similar properties
    showSimilarProperties(property);
    
    // Show the modal if it's not already open
    if (!propertyModal.classList.contains('active')) {
      propertyModal.classList.add('active');
      document.body.style.overflow = 'hidden';
      
      // Add slight delay for animation
      setTimeout(() => {
        propertyModal.classList.add('active');
      }, 10);
    }
    
    // Reset scroll positions
    const modalRightContent = document.querySelector('.modal-right-content');
    if (modalRightContent) {
      modalRightContent.scrollTop = 0;
    }
    propertyModal.scrollTop = 0;
  }

  // Close modal
  function closeModal() {
    propertyModal.classList.remove('active');
    document.body.style.overflow = 'auto';
    
    // Clean up map to prevent memory leaks
    if (detailMap) {
      detailMap.remove();
      detailMap = null;
    }
  }

  // Initialize detail map for a single property
  function initDetailMap(location) {
    const mapContainer = document.getElementById('detailMap');
    mapContainer.innerHTML = ''; // Clear previous map
    
    detailMap = L.map(mapContainer).setView(location, 15);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(detailMap);
    
    L.marker(location).addTo(detailMap)
      .bindPopup(`<strong>${document.getElementById('detailTitle').textContent}</strong>`)
      .openPopup();
  }

  // Show similar properties
  function showSimilarProperties(currentProperty) {
    const similarPropertiesContainer = document.getElementById('similarProperties');
    similarPropertiesContainer.innerHTML = '';
    
    // Find similar properties (same type or similar characteristics)
    const similarProperties = properties.filter(property => {
      return property.id !== currentProperty.id && 
             (property.type === currentProperty.type || 
              (currentProperty.type === 'land' && property.type === 'land') ||
              (property.bedrooms === currentProperty.bedrooms && currentProperty.type !== 'land'));
    });
    
    if (similarProperties.length === 0) {
      similarPropertiesContainer.innerHTML = '<p class="text-gray-600">No similar properties found.</p>';
      return;
    }
    
    // Limit to 3 similar properties
    const displayedProperties = similarProperties.slice(0, 3);
    
    displayedProperties.forEach(property => {
      const similarProperty = document.createElement('div');
      similarProperty.className = `similar-property bg-white rounded-lg shadow-md overflow-hidden transition-all hover:shadow-lg ${property.id === currentProperty.id ? 'active-property' : ''}`;
      similarProperty.innerHTML = `
        <img src="${property.images[0]}" alt="${property.title}" class="h-32 md:h-40 w-full object-cover">
        <div class="p-3 md:p-4">
          <h4 class="font-semibold text-sm md:text-base mb-1">${property.title}</h4>
          <p class="text-xs md:text-sm text-gray-600 mb-2">${property.address}</p>
          <div class="flex justify-between items-center">
            <span class="text-blue-600 font-bold text-sm md:text-base">${property.price}</span>
            <button class="view-similar text-xs md:text-sm bg-gray-100 hover:bg-gray-200 px-2 md:px-3 py-1 rounded transition-all" data-id="${property.id}">
              View
            </button>
          </div>
        </div>
      `;
      similarPropertiesContainer.appendChild(similarProperty);
    });
    
    // Add event listeners to similar property buttons and cards
    document.querySelectorAll('.view-similar').forEach(button => {
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        const propertyId = parseInt(e.target.getAttribute('data-id'));
        showPropertyDetails(propertyId);
      });
    });
    
    document.querySelectorAll('.similar-property').forEach(card => {
      card.addEventListener('click', (e) => {
        // Don't trigger if clicking on the view button (handled above)
        if (!e.target.classList.contains('view-similar')) {
          const propertyId = parseInt(card.querySelector('.view-similar').getAttribute('data-id'));
          showPropertyDetails(propertyId);
        }
      });
    });
  }

  // Filter properties based on search and filters
  function filterProperties() {
    const searchTerm = searchInput.value.toLowerCase();
    const typeFilter = filterType.value;
    const bedroomsFilter = parseInt(filterBedrooms.value);
    
    const filtered = properties.filter(property => {
      // Search term filter
      const matchesSearch = 
        property.title.toLowerCase().includes(searchTerm) || 
        property.address.toLowerCase().includes(searchTerm) || 
        property.description.toLowerCase().includes(searchTerm);
      
      // Type filter
      const matchesType = typeFilter === 'all' || property.type === typeFilter;
      
      // Bedrooms filter (skip for land properties)
      const matchesBedrooms = bedroomsFilter === 0 || 
                            (property.type === 'land' && typeFilter === 'land') || 
                            property.bedrooms >= bedroomsFilter;
      
      return matchesSearch && matchesType && matchesBedrooms;
    });
    
    renderPropertyGrid(filtered);
  }

  // Setup event listeners
  function setupEventListeners() {
    // View details buttons
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('view-details')) {
        const propertyId = parseInt(e.target.getAttribute('data-id'));
        showPropertyDetails(propertyId);
      }
    });
    
    // Close modal buttons
    modalClose.addEventListener('click', closeModal);
    propertyModal.addEventListener('click', (e) => {
      if (e.target === propertyModal) {
        closeModal();
      }
    });
    
    // Escape key to close modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && propertyModal.classList.contains('active')) {
        closeModal();
      }
    });
    
    // Search and filter inputs
    searchInput.addEventListener('input', filterProperties);
    filterType.addEventListener('change', filterProperties);
    filterBedrooms.addEventListener('change', filterProperties);
  }

  // Initialize the app when DOM is loaded
  document.addEventListener('DOMContentLoaded', init);
</script>

  <script src="/assets/js/property_search.js"></script>
  <script src="/assets/js/main.js"></script>
