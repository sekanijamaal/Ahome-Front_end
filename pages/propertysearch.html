<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects with Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Leaflet CSS and JS are still included, but the map div will be hidden on mobile -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .highlight-marker {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>

</head>
<body class="bg-black">
  <div id="header-placeholder"></div>

  <!-- Main content wrapper: flex-col on small screens, flex-row on medium and larger -->
  <!-- The height is now applied to the property list to ensure it fills the available space -->
  <div class="mt-20 flex flex-col md:flex-row h-[calc(100vh-80px)]">
    <!-- Property List Column: Takes full width on mobile, half width on medium+ -->
    <div class="w-full md:w-1/2 overflow-y-scroll p-4 bg-gray-50">
      <h2 class="text-2xl font-semibold mb-4">
        <span class="lang-text" data-lang="en" style="display: none;">Properties in Vienna</span>
        <span class="lang-text" data-lang="fr">Propriétés à Vienne</span>
      </h2>
      <!-- Responsive grid for properties: 1 column on small, 2 on medium+ -->
      <div id="property-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Map Column: Hidden on small screens, block on medium and larger -->
    <div class="hidden md:block w-full md:w-1/2 relative">
      <div id="map"></div>
    </div>
  </div>

  <div id="virtualTourModal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-[1001] p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
        <div class="flex justify-between items-center p-4 border-b border-gray-200">
            <h3 id="modalPropertyName" class="text-2xl font-bold text-gray-800"></h3>
            <button id="closeModalBtn" class="text-gray-500 hover:text-gray-800 text-3xl font-semibold leading-none">&times;</button>
        </div>

        <div class="flex-grow overflow-y-auto p-4 md:flex">
            <div class="relative w-full md:w-1/2 flex-shrink-0 mb-4 md:mb-0 md:mr-4">
                <div id="imageSlider" class="relative overflow-hidden rounded-lg h-64 md:h-full">
                    </div>
                <button id="prevSlideBtn" class="absolute top-1/2 left-2 -translate-y-1/2 bg-gray-800 bg-opacity-50 text-white p-2 rounded-full hover:bg-opacity-75 z-10">&lt;</button>
                <button id="nextSlideBtn" class="absolute top-1/2 right-2 -translate-y-1/2 bg-gray-800 bg-opacity-50 text-white p-2 rounded-full hover:bg-opacity-75 z-10">&gt;</button>
            </div>

            <div id="projectDescription" class="w-full md:w-1/2 text-gray-700 overflow-y-auto">
                <p class="mb-4">
                    </p>
                <h4 class="font-bold mt-4 mb-2">Key Features:</h4>
                <ul class="list-disc list-inside text-sm">
                    <li>Spacious living area</li>
                    <li>Modern kitchen design</li>
                    <li>Prime location in [District]</li>
                    <li>High-quality finishes</li>
                </ul>
            </div>
        </div>
    </div>
</div>
  <div id="footer-placeholder"></div>


  <script src="/assets/js/property_search.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
